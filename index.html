<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观澜账号管理</title>
<style>body{font:16px system-ui;background:#0b1115;color:#e8efed;margin:0 auto;max-width:980px;padding:32px}h1{margin-bottom:8px}p,small{color:#98aaa8}section{background:#142026;border:1px solid #314148;border-radius:16px;padding:24px;margin:20px 0}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #52666b;background:#0b1115;color:#e8efed}button{cursor:pointer;background:#a8e5ca;color:#10211a;border:0;margin:5px}button.secondary{background:#263a40;color:#e8efed}label{display:block;margin:12px 0}label input{display:block;width:min(90%,450px)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #314148}td button{font-size:13px}#message{white-space:pre-wrap;color:#a8e5ca}#error{color:#f5b5aa}</style>
<h1>观澜账号管理</h1><p>仅管理员可创建账号、发放或停用授权、重置设备绑定。临时密码只显示一次，请通过可信方式交给使用者。</p>
<section id="login"><h2>管理员登录</h2><form id="loginForm"><label>邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section>
<div id="workspace" hidden><button class="secondary" id="signout">退出管理</button><section><h2>创建并授权账号</h2><form id="createForm"><label>使用者邮箱<input id="newEmail" type="email" required></label><label>授权天数（1–365）<input id="newDays" type="number" min="1" max="365" value="30" required></label><button>创建账号</button></form></section><section><h2>账号与授权</h2><button class="secondary" id="reload">刷新</button><table><thead><tr><th>邮箱</th><th>授权</th><th>到期</th><th>设备</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section></div><p id="message" role="status"></p><p id="error" role="alert"></p>
<script>const base='https://jodgrqjyvqfiqxdixuva.supabase.co/functions/v1/admin-license',key='sb_publishable_d3DmQ3Vt0iYqM7xGqucQ4w_g9yJNwdE';let token='';const q=id=>document.getElementById(id),msg=t=>{q('message').textContent=t;q('error').textContent=''},err=e=>{q('error').textContent=String(e.message||e)};
async function api(action,payload={}){const r=await fetch(base,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token,'apikey':key},body:JSON.stringify({action,...payload})});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
async function refresh(){const d=await api('list');const rows=q('rows');rows.replaceChildren();for(const x of d.users){const tr=document.createElement('tr');for(const text of [x.email,x.status||'disabled',x.expiresAt?new Date(x.expiresAt).toLocaleString():'—',x.bound?'已绑定':'未绑定']){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td');for(const [label,action] of [['授权30天','grant'],['停用','disable'],['重置设备','reset']]){const b=document.createElement('button');b.className='secondary';b.textContent=label;b.onclick=async()=>{if(!confirm('确认对 '+x.email+' 执行 '+label+'？'))return;try{await api(action,{userId:x.id});msg('已完成：'+label);await refresh()}catch(e){err(e)}};td.append(b)}tr.append(td);rows.append(tr)}}
q('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('https://jodgrqjyvqfiqxdixuva.supabase.co/auth/v1/token?grant_type=password',{method:'POST',headers:{'content-type':'application/json','apikey':key},body:JSON.stringify({email:q('email').value,password:q('password').value})});const d=await r.json();q('password').value='';if(!r.ok)throw Error('邮箱或密码不正确');token=d.access_token;await refresh();q('login').hidden=true;q('workspace').hidden=false;msg('管理员身份已验证')}catch(e){token='';err(e)}};
q('createForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('create',{email:q('newEmail').value,days:Number(q('newDays').value)});msg('账号已创建。临时密码（仅显示一次）：'+d.password+'\n邮箱：'+d.email);q('newEmail').value='';await refresh()}catch(e){err(e)}};
q('reload').onclick=()=>refresh().catch(err);q('signout').onclick=()=>{token='';q('workspace').hidden=true;q('login').hidden=false;msg('已退出管理')};</script></html>
