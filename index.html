<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观澜账号管理</title>
<style>
html{box-sizing:border-box}*,*:before,*:after{box-sizing:inherit}
body{font:16px system-ui;background:#0b1115;color:#e8efed;margin:0 auto;max-width:min(1600px,100%);padding:32px 40px}
h1{margin-bottom:8px}p,small{color:#98aaa8}
section{background:#142026;border:1px solid #314148;border-radius:16px;padding:24px;margin:20px 0}
input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #52666b;background:#0b1115;color:#e8efed}
button{cursor:pointer;background:#a8e5ca;color:#10211a;border:0;margin:5px}
button.secondary{background:#263a40;color:#e8efed}
label{display:block;margin:12px 0}label input{display:block;width:min(90%,450px)}
.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:10px;border-bottom:1px solid #314148;white-space:nowrap}
td:nth-child(5){white-space:normal;min-width:220px}td:last-child{white-space:normal}
td button{font-size:13px}#message{white-space:pre-wrap;color:#a8e5ca}#error{color:#f5b5aa}
.log-filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.log-filters label{margin:0}.log-filters label input{width:220px}
#logRows td{white-space:normal;font-size:13px}
.warn{color:#f0c674}.error{color:#f5b5aa}
</style>
<h1>观澜账号管理</h1>
<p>仅管理员可创建账号、发放或停用授权、重置设备绑定和账号密码。管理员自定账号名、密码和授权天数，再通过可信方式交给使用者。</p>
<section id="login"><h2>管理员登录</h2>
<form id="loginForm"><label>邮箱<input id="email" type="email" autocomplete="username" required></label>
<label>密码<input id="password" type="password" autocomplete="current-password" required></label>
<button id="loginButton" type="submit">登录</button></form></section>
<div id="workspace" hidden>
<button class="secondary" id="signout">退出管理</button>
<section><h2>创建并授权账号</h2>
<form id="createForm">
<label>使用者账号名<input id="newAccount" type="text" minlength="3" maxlength="32" required placeholder="例如 guanlan001"></label>
<small>3–32 位字母、数字、中文、点、下划线或短横线；不需要邮箱。</small>
<label>使用者密码<input id="newPassword" type="password" minlength="8" maxlength="72" required></label>
<label>确认密码<input id="confirmPassword" type="password" minlength="8" maxlength="72" required></label>
<label>授权天数（1–365）<input id="newDays" type="number" min="1" max="365" value="30" required></label>
<button>创建账号</button></form></section>
<section><h2>账号与使用记录</h2>
<button class="secondary" id="reload">刷新</button>
<p>最近校验表示客户端通过授权检查的时间，不代表准确在线状态。设备环境需新版观澜登录或重新校验后才会出现。</p>
<div class="table-scroll"><table><thead><tr><th>账号</th><th>授权</th><th>到期</th><th>最近登录</th><th>设备信息</th><th>首次绑定</th><th>最近校验</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section><h2>账号日志</h2>
<p>客户端上报的登录、退出、选游戏、连大厅、拉桌台、挂机和真钱下注。只保留 15 天。按账号名筛选，留空则看全部。</p>
<div class="log-filters">
<label>账号名<input id="logAccount" type="search" placeholder="例如 guanlan001"></label>
<button class="secondary" id="logSearch" type="button">查询</button>
</div>
<div class="table-scroll"><table><thead><tr><th>时间</th><th>账号</th><th>事件</th><th>说明</th><th>版本</th></tr></thead><tbody id="logRows"></tbody></table></div>
</section>
</div>
<p id="message" role="status"></p><p id="error" role="alert"></p>
<script>
const base='https://jodgrqjyvqfiqxdixuva.supabase.co/functions/v1/admin-license',key='sb_publishable_d3DmQ3Vt0iYqM7xGqucQ4w_g9yJNwdE';
let token='';
const q=id=>document.getElementById(id),msg=t=>{q('message').textContent=t;q('error').textContent=''},err=e=>{q('error').textContent=String(e.message||e)};
const kinds={login_ok:'登录成功',login_fail:'登录失败',logout_user:'主动退出',logout_forced:'被退出登录',hang_start:'开始挂机',hang_stop:'停止挂机',hang_halt:'停止条件',bet_result:'真钱下注',game_select:'选择游戏',game_connect:'游戏连接',tables_sync:'桌台数据',client_error:'客户端报错'};
async function api(action,payload={}){const r=await fetch(base,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token,'apikey':key},body:JSON.stringify({action,...payload}),signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
const when=t=>t?new Date(t).toLocaleString():'—';
const device=x=>!x.bound?'未绑定':[x.devicePlatform&&x.deviceArch?x.devicePlatform+' / '+x.deviceArch:'设备环境待同步',x.clientVersion?'观澜 '+x.clientVersion:null,x.deviceCode?'设备码 '+x.deviceCode:null].filter(Boolean).join(' · ');
async function refresh(){const d=await api('list');const rows=q('rows');rows.replaceChildren();for(const x of d.users){const tr=document.createElement('tr');for(const text of [x.account,x.status||'disabled',when(x.expiresAt),when(x.lastSignInAt),device(x),when(x.deviceBoundAt),when(x.lastSeenAt)]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td');for(const [label,action] of [['授权30天','grant'],['停用','disable'],['重置设备','reset'],['重置密码','resetPassword']]){const b=document.createElement('button');b.className='secondary';b.textContent=label;if(action==='resetPassword'&&!d.canResetPassword){b.disabled=true;b.title='密码重置接口待发布';}b.onclick=async()=>{const question=action==='resetPassword'?'确认将 '+x.account+' 的密码重置为 qwer1234？':'确认对 '+x.account+' 执行 '+label+'？';if(!confirm(question))return;b.disabled=true;b.textContent=label+'中…';msg('正在对 '+x.account+' 执行 '+label+'…');try{await api(action,{userId:x.id});msg(action==='resetPassword'?'已重置 '+x.account+' 的密码为 qwer1234':'已完成：'+label);await refresh()}catch(e){q('message').textContent='';err(e)}finally{b.disabled=false;b.textContent=label}};td.append(b)}tr.append(td);rows.append(tr)}await loadLogs().catch(()=>{})}
async function loadLogs(){const d=await api('logs',{account:q('logAccount').value});const rows=q('logRows');rows.replaceChildren();if(!d.logs||!d.logs.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=5;td.textContent='最近 15 天没有匹配的日志';tr.append(td);rows.append(tr);return}for(const x of d.logs){const tr=document.createElement('tr');if(x.level==='error')tr.className='error';else if(x.level==='warn')tr.className='warn';for(const text of [when(x.at),x.account,kinds[x.kind]||x.kind,x.message,x.client_version||'—']){const td=document.createElement('td');td.textContent=text;tr.append(td)}rows.append(tr)}}
let loggingIn=false;
q('loginForm').onsubmit=async e=>{e.preventDefault();if(loggingIn)return;loggingIn=true;const button=q('loginButton');button.disabled=true;button.textContent='登录中…';q('loginForm').setAttribute('aria-busy','true');msg('登录中，请稍候…');try{const r=await fetch('https://jodgrqjyvqfiqxdixuva.supabase.co/auth/v1/token?grant_type=password',{method:'POST',headers:{'content-type':'application/json','apikey':key},body:JSON.stringify({email:q('email').value,password:q('password').value}),signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok||!d.access_token)throw Error('邮箱或密码不正确');token=d.access_token;msg('正在验证管理员身份…');await refresh();q('login').hidden=true;q('workspace').hidden=false;msg('管理员身份已验证')}catch(e){token='';q('message').textContent='';err(e.name==='TimeoutError'?Error('登录超时，请检查网络后重试'):e)}finally{q('password').value='';loggingIn=false;button.disabled=false;button.textContent='登录';q('loginForm').removeAttribute('aria-busy')}};
q('createForm').onsubmit=async e=>{e.preventDefault();try{if(q('newPassword').value!==q('confirmPassword').value)throw Error('两次密码不一致');const d=await api('create',{account:q('newAccount').value,password:q('newPassword').value,days:Number(q('newDays').value)});msg('账号已创建并授权：'+d.account+'。请将你设置的密码交给使用者。');q('newAccount').value='';q('newPassword').value='';q('confirmPassword').value='';await refresh()}catch(e){err(e)}};
q('reload').onclick=()=>refresh().catch(err);
q('logSearch').onclick=()=>loadLogs().catch(err);
q('logAccount').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();loadLogs().catch(err)}});
q('signout').onclick=()=>{token='';q('workspace').hidden=true;q('login').hidden=false;msg('已退出管理')};
</script></html>
